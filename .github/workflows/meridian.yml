name: Meridian integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify batch, Kafka, and checkpoint recovery
        run: bash Testing/VerifyMeridianContainers.sh
