apiVersion: v1
kind: ConfigMap
metadata:
  name: meridian-streaming
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC: meridian-tracking-events
  MERIDIAN_MAX_OFFSETS: "11"
  STREAM_CHECKPOINT: abfss://adlsgen2jdcontainer@adlsgen2jd.dfs.core.windows.net/meridian/stream/checkpoint
  STREAM_LEDGER: abfss://adlsgen2jdcontainer@adlsgen2jd.dfs.core.windows.net/meridian/stream/ledger
  STREAM_WINDOWS: meridian.stream.hub_windows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-stream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: meridian-stream
  template:
    metadata:
      labels:
        app: meridian-stream
    spec:
      containers:
        - name: stream
          image: meridian-spark-jobs:0.1.0
          envFrom:
            - configMapRef:
                name: meridian-streaming
          args:
            - --master
            - local[2]
            - --driver-memory
            - 768m
            - --properties-file
            - /etc/meridian/spark-defaults.conf
            - --class
            - MeridianStreaming
            - /opt/meridian/meridian.jar
            - kafka
            - $(KAFKA_BOOTSTRAP_SERVERS)
            - $(STREAM_CHECKPOINT)
            - $(STREAM_LEDGER)
            - $(KAFKA_TOPIC)
            - $(STREAM_WINDOWS)
          ports:
            - name: spark-ui
              containerPort: 4040
          startupProbe:
            tcpSocket:
              port: spark-ui
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: spark-ui
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: spark-config
              mountPath: /etc/meridian
              readOnly: true
      volumes:
        - name: spark-config
          secret:
            secretName: meridian-spark-config
---
apiVersion: v1
kind: Service
metadata:
  name: meridian-stream-ui
spec:
  selector:
    app: meridian-stream
  ports:
    - port: 4040
      targetPort: spark-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meridian-producer
  template:
    metadata:
      labels:
        app: meridian-producer
    spec:
      containers:
        - name: producer
          image: meridian-kafka-producer:0.1.0
          envFrom:
            - configMapRef:
                name: meridian-streaming
          env:
            - name: REPLAY_KEEP_ALIVE
              value: "true"
            - name: REPLAY_CREATE_TOPIC
              value: "true"
          readinessProbe:
            exec:
              command: [test, -f, /tmp/replay-complete]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: meridian-batch-check
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: batch
          image: meridian-spark-jobs:0.1.0
          args:
            - --master
            - local[2]
            - --driver-memory
            - 768m
            - --conf
            - spark.sql.shuffle.partitions=4
            - --class
            - meridian.BatchJob
            - /opt/meridian/meridian.jar
            - /opt/meridian/batch-input
            - --check
          resources:
            requests:
              cpu: 500m
              memory: 1024Mi
            limits:
              cpu: "2"
              memory: 1536Mi
